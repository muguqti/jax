name: Build and Test jaxlib (Windows ARM64)

# Trial-and-error CI for porting jaxlib to Windows ARM64.
# Uses native windows-11-arm GitHub Actions runners.
# Host machine is ARM64 Windows 11; this workflow targets ARM64.
#
# To test without triggering other workflows, push to a branch matching
# 'test/windows-arm64**' – only this workflow listens to that pattern.

on:
  push:
    branches:
      - main
      - 'test/windows-arm64**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to build with"
        required: false
        default: "3.13"
      llvm_version:
        description: "LLVM version (e.g. 22.1.0). Leave empty to auto-detect latest WoA64."
        required: false
        default: ""
      debug_enabled:
        description: "Enable tmate debug session on failure"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jaxlib-windows-arm64:
    name: Build jaxlib wheel (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 180

    env:
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.13' }}
      LLVM_VERSION_INPUT: ${{ github.event.inputs.llvm_version || '' }}
      # Use bazelisk to avoid manual Bazel binary SHA256 management.
      USE_BAZEL_VERSION: "8.7.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Python setup
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # numpy and scipy are available as pre-built wheels; skip for core jaxlib build test.
          # The Bazel build itself does not require them to be pre-installed at this stage.
          # Uncomment if the build script explicitly needs them before Bazel runs:
          # python -m pip install numpy scipy

      # -----------------------------------------------------------------------
      # Bazel setup via bazelisk
      # -----------------------------------------------------------------------
      - name: Install bazelisk
        shell: pwsh
        run: |
          # Install bazelisk via Chocolatey (available on GitHub-hosted runners)
          choco install bazelisk -y --no-progress
          # Verify
          bazel version

      # -----------------------------------------------------------------------
      # LLVM / clang-cl setup - native ARM64 (WoA64) build
      # -----------------------------------------------------------------------
      - name: Install LLVM WoA64 (native ARM64 clang-cl)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the native Windows-on-ARM64 LLVM release instead of the x86
          # Chocolatey package. The WoA64 installer produces a true ARM64
          # clang/clang-cl that Bazel can use to compile ARM64 targets natively.

          $requestedVersion = "${{ env.LLVM_VERSION_INPUT }}"

          if ($requestedVersion -ne "") {
            # Use the explicitly requested version
            $downloadUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${requestedVersion}/LLVM-${requestedVersion}-woa64.exe"
            $llvmTag = "llvmorg-${requestedVersion}"
            Write-Host "Using requested LLVM version: $requestedVersion"
          } else {
            # Auto-detect the latest release that has a WoA64 asset
            Write-Host "Auto-detecting latest LLVM WoA64 release..."
            $page = 1
            $downloadUrl = $null
            $llvmTag = $null
            while (-not $downloadUrl) {
              $releases = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/llvm/llvm-project/releases?per_page=10&page=$page" `
                -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
                -UseBasicParsing
              if ($releases.Count -eq 0) { break }
              foreach ($release in $releases) {
                $woaAsset = $release.assets | Where-Object { $_.name -match "^LLVM-[\d.]+-woa64\.exe$" }
                if ($woaAsset) {
                  $downloadUrl = $woaAsset.browser_download_url
                  $llvmTag = $release.tag_name
                  Write-Host "Found: $($release.tag_name) -> $($woaAsset.name)"
                  break
                }
              }
              $page++
              if ($page -gt 5) { break }
            }
          }

          if (-not $downloadUrl) {
            Write-Error "Could not find a LLVM WoA64 installer. Set llvm_version input explicitly."
            exit 1
          }

          Write-Host "Downloading LLVM WoA64 from: $downloadUrl"
          $installer = "$env:TEMP\LLVM-woa64.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer -UseBasicParsing

          Write-Host "Installing LLVM WoA64 silently..."
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          # The WoA64 installer places binaries in the same default path
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            # Some versions install to Program Files (Arm)
            $llvmBin = "C:\Program Files (Arm)\LLVM\bin"
          }
          if (Test-Path $llvmBin) {
            Write-Host "LLVM installed at: $llvmBin"
            echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "LLVM_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "LLVM_TAG=$llvmTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            # Fallback: search for clang-cl.exe
            $clangCl = Get-ChildItem "C:\Program Files*" -Recurse -Filter "clang-cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($clangCl) {
              $llvmBin = $clangCl.DirectoryName
              Write-Host "Found clang-cl at: $llvmBin"
              echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "LLVM_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Error "LLVM installation not found. Check installer output."
              exit 1
            }
          }

          # Verify the installed binaries
          Write-Host "=== LLVM version info ==="
          clang --version
          clang-cl --version
          Write-Host "=== Architecture check ==="
          (Get-Item "$llvmBin\clang.exe").VersionInfo | Select-Object FileDescription, ProductVersion

      # -----------------------------------------------------------------------
      # Configure MSVC + LLVM paths for Bazel local_config_cc
      # -----------------------------------------------------------------------
      - name: Configure MSVC and LLVM paths for Bazel (ARM64)
        shell: pwsh
        run: |
          # Bazel's clang_local config uses @local_config_cc which requires
          # MSVC to be discoverable. The variables must be passed as --repo_env
          # flags so Bazel's cc_configure() repository rule can see them.
          # We write them to .bazelrc.user which is imported by .bazelrc via
          #   try-import %workspace%/.bazelrc.user
          #
          # IMPORTANT: Bazel's .bazelrc parser splits on spaces, so paths like
          # "C:\Program Files\..." break the parse. We create directory junctions
          # at space-free paths (C:\MSVC, C:\LLVM, C:\GitBash) and use those.

          $lines = @(
            "# Auto-generated by CI - toolchain paths for @local_config_cc",
            "# Increase JVM heap to avoid OOM during module resolution on ARM64 runner",
            "startup --host_jvm_args=-Xmx6g"
          )

          # Helper: create (or recreate) a directory junction at $link -> $target
          function New-Junction($link, $target) {
            if (Test-Path $link) {
              Write-Host "Removing existing junction/dir: $link"
              cmd /c rmdir "$link" 2>$null
              if (Test-Path $link) { Remove-Item -Recurse -Force $link }
            }
            cmd /c mklink /J "$link" "$target"
            if (Test-Path $link) {
              Write-Host "Junction created: $link -> $target"
            } else {
              Write-Warning "Failed to create junction $link -> $target"
            }
          }

          # 1. Find Visual Studio / MSVC using vswhere
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath 2>$null
            Write-Host "Visual Studio path: $vsPath"
            $vcToolsBase = "$vsPath\VC\Tools\MSVC"
            if (Test-Path $vcToolsBase) {
              $vcVer = Get-ChildItem $vcToolsBase | Sort-Object Name -Descending | Select-Object -First 1
              $bazelVcOrig = "$vcToolsBase\$($vcVer.Name)"
              Write-Host "BAZEL_VC (original): $bazelVcOrig"
              New-Junction "C:\MSVC" $bazelVcOrig
              $lines += "common --repo_env=BAZEL_VC=C:/MSVC"
            } else {
              Write-Warning "MSVC tools not found at $vcToolsBase"
            }
          } else {
            Write-Warning "vswhere not found - BAZEL_VC not set"
          }

          # 2. Set BAZEL_LLVM to the LLVM root (parent of bin/)
          $llvmRoot = $null
          if ($env:LLVM_PATH) {
            $llvmRoot = Split-Path $env:LLVM_PATH -Parent
          } else {
            foreach ($candidate in @("C:\Program Files\LLVM", "C:\Program Files (Arm)\LLVM")) {
              if (Test-Path "$candidate\bin\clang-cl.exe") {
                $llvmRoot = $candidate
                break
              }
            }
          }
          if ($llvmRoot) {
            Write-Host "BAZEL_LLVM (original): $llvmRoot"
            New-Junction "C:\LLVM" $llvmRoot
            $lines += "common --repo_env=BAZEL_LLVM=C:/LLVM"
          }

          # 3. Set BAZEL_SH so Bazel can find bash on Windows
          foreach ($bash in @("C:\Program Files\Git\bin\bash.exe", "C:\msys64\usr\bin\bash.exe")) {
            if (Test-Path $bash) {
              Write-Host "BAZEL_SH (original): $bash"
              $bashDir = Split-Path $bash -Parent
              New-Junction "C:\GitBash" $bashDir
              $lines += "common --repo_env=BAZEL_SH=C:/GitBash/bash.exe"
              break
            }
          }

          # Write to .bazelrc.user (imported by .bazelrc via try-import)
          $lines | Out-File -FilePath ".bazelrc.user" -Encoding utf8
          Write-Host "=== .bazelrc.user written ==="
          Get-Content ".bazelrc.user"

      # -----------------------------------------------------------------------
      # Build jaxlib wheel
      # -----------------------------------------------------------------------
      - name: Configure and build jaxlib wheel
        shell: pwsh
        run: |
          # Windows ARM64 has no RBE support; fall back to the local CI config.
          # build/build.py is a Python script so we can call it directly.
          python build/build.py build `
            --wheels=jaxlib `
            --python_version=${{ env.PYTHON_VERSION }} `
            --bazel_options=--config=ci_windows_arm64 `
            --verbose `
            --output_path=dist

      - name: List built wheels
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter "*.whl" | ForEach-Object {
            Write-Host "Built wheel: $($_.Name)"
          }

      # -----------------------------------------------------------------------
      # Upload wheel artifact
      # -----------------------------------------------------------------------
      - name: Upload jaxlib wheel
        uses: actions/upload-artifact@v4
        with:
          name: jaxlib-windows-arm64-py${{ env.PYTHON_VERSION }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Test job - runs on the same ARM64 runner using the wheel built above
  # ---------------------------------------------------------------------------
  test-jaxlib-windows-arm64:
    name: Test jaxlib (Windows ARM64)
    needs: build-jaxlib-windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 60

    env:
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.13' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Download jaxlib wheel
        uses: actions/download-artifact@v4
        with:
          name: jaxlib-windows-arm64-py${{ env.PYTHON_VERSION }}
          path: dist

      - name: Install jaxlib and dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Install the locally built jaxlib wheel
          $wheel = Get-ChildItem -Path dist -Filter "jaxlib*.whl" | Select-Object -First 1
          if (-not $wheel) {
            Write-Error "No jaxlib wheel found in dist/"
            exit 1
          }
          Write-Host "Installing: $($wheel.FullName)"
          python -m pip install $wheel.FullName
          # Install JAX (pure Python, from source)
          python -m pip install -e . --no-build-isolation
          # Install test dependencies (numpy/scipy available as wheels)
          python -m pip install numpy scipy absl-py pytest

      - name: Smoke test - import jax
        shell: pwsh
        run: |
          python -c "import jax; print('JAX version:', jax.__version__); print('Devices:', jax.devices())"

      - name: Run basic JAX tests
        shell: pwsh
        run: |
          # Run a small subset of tests that are known to work on CPU.
          # Expand this list as more tests pass.
          python -m pytest tests/lax_numpy_test.py -x -q `
            --tb=short `
            -k "not gpu and not tpu" `
            --timeout=300 `
            -p no:warnings `
            2>&1 | Tee-Object -FilePath test_output.txt
          $exitCode = $LASTEXITCODE
          Get-Content test_output.txt
          exit $exitCode

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-arm64-py${{ env.PYTHON_VERSION }}
          path: test_output.txt
          retention-days: 7

      # -----------------------------------------------------------------------
      # Optional: tmate debug session on failure
      # -----------------------------------------------------------------------
      - name: Setup tmate session on failure
        if: ${{ failure() && github.event.inputs.debug_enabled == 'true' }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30